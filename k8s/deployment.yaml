apiVersion: v1
kind: Namespace
metadata:
  name: ipl-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: ipl-secrets
  namespace: ipl-platform
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: iplpassword123
  POSTGRES_DB: ipl_db
  DATABASE_URL: "postgresql://postgres:iplpassword123@postgres-service.ipl-platform.svc.cluster.local:5432/ipl_db"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipl-config
  namespace: ipl-platform
data:
  API_PORT: "3001"
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "/api"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ipl-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ipl-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: ipl-secrets
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ipl-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipl-api
  namespace: ipl-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipl-api
  template:
    metadata:
      labels:
        app: ipl-api
    spec:
      containers:
        - name: api
          image: ghcr.io/ipl-data-platform/ipl-api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: ipl-config
            - secretRef:
                name: ipl-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ipl-api-service
  namespace: ipl-platform
spec:
  selector:
    app: ipl-api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipl-web
  namespace: ipl-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipl-web
  template:
    metadata:
      labels:
        app: ipl-web
    spec:
      containers:
        - name: web
          image: ghcr.io/ipl-data-platform/ipl-web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ipl-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ipl-web-service
  namespace: ipl-platform
spec:
  selector:
    app: ipl-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ipl-ingress
  namespace: ipl-platform
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ipl-api-service
                port:
                  number: 3001
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: ipl-api-service
                port:
                  number: 3001
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: ipl-api-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ipl-web-service
                port:
                  number: 3000
