services:
  postgres:
    image: postgres:16-alpine
    container_name: ipl_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ipl_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: builder
    container_name: ipl_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ipl_db
      API_PORT: 3001
      NODE_ENV: development
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./Indian_Premier_League_2022-03-26:/app/Indian_Premier_League_2022-03-26
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "cd apps/api && npm run dev"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: builder
    container_name: ipl_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/src:/app/apps/web/src
    depends_on:
      - api
    command: sh -c "rm -rf apps/web/.next && cd apps/web && npm run dev"

volumes:
  postgres_data:
